<p>form-group-demo works!</p>
<section class="demo">
  <h1>FORM GROUP</h1>
  <form [formGroup]="formulaire" (ngSubmit)="envoyer()">
    <label>
      nom
      <!--formControlName="nom" le "nom" est la clé pour accéder à la valeur-->
      <input type="text" formControlName="nom">
    </label>
    <label>
      âge
      <!--type number important sinon il nous renvoie un string '50'-->
      <input type="number" formControlName="age">
    </label>
    <div formGroupName="adress">
      <label>
        Rue
        <input type="text" formControlName="rue">
      </label>
      <label>
        Numéro
        <input type="number" formControlName="numero">
      </label>
    </div>
    <button type="submit"Envoyer>Envoyer</button>

  </form>
      <p>Le formulaire est valide ? {{formulaire.valid}}</p>
      <p>Le sous-formulaire adresse est valide ? {{formulaire.controls.adress.valid}}</p>
      <!--le DTO créé à l'envoi, celui qu'on donnerait au service-->
      <pre>{{ dto() | json }}</pre>
</section>
