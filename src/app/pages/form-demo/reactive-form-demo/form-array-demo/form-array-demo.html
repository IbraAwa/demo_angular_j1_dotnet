<p>form-array-demo works!</p>
<form [formGroup]="formulaire">
  <label>
    Nom
    <input formControlName="nom">
  </label>
  <label>
    Telephones
    <button (click)="AjouterInputTelephone()">+</button>
  </label>
  <!--Exactement comm formControlName on a une key contenu par formulaire-->
  <fieldset formArrayName="telephones">
    @for (telephone of telephones.value; track $index) {
      <input [formControlName]="$index">
      <button (click)="RetirerInputTelephone($index)">-</button>
      <br>
    }
  </fieldset>
</form>
